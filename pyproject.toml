[project]
name = "trenches"
version = "0.1.0"
description = "Solana launch ingest + decision journal. Week 1: ingest and journal only."
requires-python = ">=3.11,<3.13"

# Runtime deps are deliberately few. Every added package is supply-chain
# surface per CLAUDE.md 3.10, and the dominant control there is a time delay,
# not a scanner. Do not add a dependency without reading its tree first.
dependencies = [
    "asyncpg>=0.30,<0.32",
    "grpcio>=1.68,<2",
    "protobuf>=5.28,<8",
    "base58>=2.1,<3",
    "websockets>=13,<18",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "grpcio-tools>=1.68,<2",
    "ruff>=0.7,<1",
]

[project.scripts]
trenches = "trenches.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trenches"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:trenches.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]
# S101 assert: used in tests. S608 SQL string building: repo.py builds no
# SQL from user input; every statement is a literal with bound params.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"src/trenches/pb/*" = ["ALL"]
